name: Update contributed file languages

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"
      timezone: "America/Chicago"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate file-language card
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: ayoushmanb
        run: |
          python scripts/contributed_file_languages.py

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add generated/contributed-file-languages.svg
          git add generated/contributed-file-repos.json

          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update contributed file language stats"
            git push
          fi
